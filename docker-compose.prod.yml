services:
  postgres:
    image: postgres:16-alpine
    container_name: openquant-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openquant}
      POSTGRES_USER: ${POSTGRES_USER:-openquant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openquant_secure_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c shared_buffers=512MB
               -c max_connections=200
               -c work_mem=16MB
               -c maintenance_work_mem=64MB
               -c min_wal_size=1GB
               -c max_wal_size=4GB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_cache_size=1536MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openquant_user} -d ${POSTGRES_DB:-openquant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openquant-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  redis:
    image: redis:7.2-alpine
    container_name: openquant-redis-prod
    restart: unless-stopped
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:-redis_secure_password_change_me}"
                   --appendonly yes
                   --appendfsync everysec
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openquant-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: openquant/backend:latest
    container_name: openquant-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-openquant_user}:${POSTGRES_PASSWORD:-openquant_secure_password_change_me}@postgres:5432/${POSTGRES_DB:-openquant}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password_change_me}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_super_secret_jwt_key_minimum_32_characters}
      OPENQUANT_MASTER_SECRET: ${OPENQUANT_MASTER_SECRET:-openquant_production_master_fernet_vault_key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://trading.yourdomain.com,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - openquant-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: openquant/frontend:latest
    container_name: openquant-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - openquant-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: openquant-prometheus-prod
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deployments/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - openquant-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  grafana:
    image: grafana/grafana:10.4.0
    container_name: openquant-grafana-prod
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_secure_change_me}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - openquant-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  openquant-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
