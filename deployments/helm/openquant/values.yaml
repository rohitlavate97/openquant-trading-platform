# Production Helm Values for OpenQuant Platform

global:
  environment: production
  domain: trading.example.com

backend:
  replicaCount: 3
  image:
    repository: openquant/backend
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    LOG_LEVEL: INFO
    ALLOWED_ORIGINS: "https://trading.example.com"
  secrets:
    jwtSecret: "change_me_super_secret_jwt_key_minimum_32_characters"
    masterSecret: "openquant_production_master_fernet_vault_key"

frontend:
  replicaCount: 2
  image:
    repository: openquant/frontend
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "openquant-backend"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: trading.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /ws
          pathType: Prefix
          service: backend
        - path: /metrics
          pathType: Prefix
          service: backend
  tls:
    - secretName: openquant-tls-certs
      hosts:
        - trading.example.com

database:
  host: postgresql.database.svc.cluster.local
  port: 5432
  name: openquant
  user: openquant_user
  password: "openquant_secure_password_change_me"

redis:
  host: redis.cache.svc.cluster.local
  port: 6379
  password: "redis_secure_password_change_me"
