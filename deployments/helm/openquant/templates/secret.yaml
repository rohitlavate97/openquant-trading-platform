apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openquant.fullname" . }}-secrets
  labels:
    {{- include "openquant.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  REDIS_URL: "redis://:{{ .Values.redis.password }}@{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
  JWT_SECRET_KEY: {{ .Values.backend.secrets.jwtSecret | quote }}
  OPENQUANT_MASTER_SECRET: {{ .Values.backend.secrets.masterSecret | quote }}
