apiVersion: v1
kind: Service
metadata:
  name: {{ include "openquant.fullname" . }}-frontend
  labels:
    app.kubernetes.io/component: frontend
    {{- include "openquant.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/name: {{ include "openquant.name" . }}
