services:
  postgres:
    image: postgres:16-alpine
    container_name: openquant-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openquant_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-openquant_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openquant} -d ${POSTGRES_DB:-openquant_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openquant-dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: openquant-dev-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-openquant}:${POSTGRES_PASSWORD:-openquant_dev_password}@postgres:5432/${POSTGRES_DB:-openquant_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8000:8000"

volumes:
  postgres_dev_data:
  redis_dev_data:
